{% block content %}
<div class="container my-5">
    <h1 class="mb-4">My Account</h1>

    <div class="card p-4">

        <p>Manage your Case & Connect Wholesalers account here.</p>

        <h3 class="h5 mt-3">Account Details</h3>

        <p><strong>Email:</strong> {{ user.email }}</p>
    </div>
</div>
{% endblock %}
